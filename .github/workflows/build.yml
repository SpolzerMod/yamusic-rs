# Каждый push и PR: clippy, тесты и сборки в артефактах: exe для Windows и .app для macOS
# (один бинарник для Apple Silicon и Intel, в zip).
# Тег v* (например v1.0.1): то же и релиз с обоими файлами. Windows-обновлялка ищет в нём
# yamusic-rs.exe, на macOS приложение само себя не обновляет.
name: Сборка

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Тег совпадает с версией в Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME, а в Cargo.toml версия $v"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release

      - name: SHA-256
        shell: pwsh
        run: (Get-FileHash target/release/yamusic-rs.exe -Algorithm SHA256).Hash.ToLower()

      # Без zip: из артефактов скачивается сразу yamusic-rs.exe.
      - uses: actions/upload-artifact@v7
        with:
          path: target/release/yamusic-rs.exe
          archive: false

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      - run: tools/bundle_macos.sh --universal

      - name: Архив
        run: ditto -c -k --keepParent "target/release/bundle/Яндекс Музыка RS.app" yamusic-rs-macos-universal.zip

      # Zip уже есть: из артефактов скачивается сразу он.
      - uses: actions/upload-artifact@v7
        with:
          path: yamusic-rs-macos-universal.zip
          archive: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/yamusic-rs.exe dist/yamusic-rs-macos-universal.zip --title "Яндекс Музыка RS ${GITHUB_REF_NAME#v}" --generate-notes
