# Каждый push и PR: clippy, тесты и exe в артефактах.
# Тег v* (например v1.0.1): то же и релиз с yamusic-rs.exe — его ищет встроенная обновлялка.
# Linux (ветка linux-port): clippy, тесты и deb-пакет в артефактах.
name: Сборка

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Тег совпадает с версией в Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME, а в Cargo.toml версия $v"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release

      - name: SHA-256
        shell: pwsh
        run: (Get-FileHash target/release/yamusic-rs.exe -Algorithm SHA256).Hash.ToLower()

      # Без zip: из артефактов скачивается сразу yamusic-rs.exe.
      - uses: actions/upload-artifact@v7
        with:
          path: target/release/yamusic-rs.exe
          archive: false

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/release/yamusic-rs.exe --title "Яндекс Музыка RS ${GITHUB_REF_NAME#v}" --generate-notes

  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # System-зависимости slint/winit/rodio: alsa, fontconfig/freetype, xkbcommon/wayland/x11.
      - name: Зависимости сборки
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev

      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release

      # Известные уязвимости в дереве зависимостей (RustSec). Отчёт в логе джобы.
      - name: cargo audit
        run: |
          cargo install --locked cargo-audit
          cargo audit
      - run: cargo install --locked cargo-deb
      - run: cargo deb

      - uses: actions/upload-artifact@v7
        with:
          path: target/debian/*.deb
          archive: false

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEB: target/debian/*.deb
        # Релиз создаёт windows-джоба; ждём его и докидываем deb (до 10 минут).
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Яндекс Музыка RS ${GITHUB_REF_NAME#v}" --generate-notes \
            || true
          for i in $(seq 1 60); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 10
          done
          gh release upload "$GITHUB_REF_NAME" $DEB --clobber
