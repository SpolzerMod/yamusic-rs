<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Открыть трек — Яндекс Музыка RS</title>
<meta name="description" content="Открывает трек в Яндекс Музыке или в веб-плеере.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b0b">
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<style>
@font-face{font-family:Manrope;font-weight:500 700;font-display:swap;src:url(fonts/manrope-cyrillic.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Manrope;font-weight:500 700;font-display:swap;src:url(fonts/manrope-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Oswald;font-weight:600 700;font-display:swap;src:url(fonts/oswald-cyrillic.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Oswald;font-weight:600 700;font-display:swap;src:url(fonts/oswald-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--ink:#0b0b0b;--fg:#f3f0e6;--y:#ffdf2b;--dim:#8d897f;--head:Oswald,Impact,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{display:grid;place-items:center;padding:24px;background:var(--ink);color:var(--fg);font:500 16px/1.5 Manrope,system-ui,sans-serif;text-align:center;-webkit-font-smoothing:antialiased}
main{display:grid;justify-items:center;gap:8px;max-width:420px}
img{width:72px;height:72px}
h1{margin-top:12px;font:700 clamp(24px,5vw,32px)/1.1 var(--head);text-transform:uppercase;letter-spacing:.01em}
p{color:var(--dim);font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:52px;margin-top:16px;padding:0 28px;border-radius:99px;background:var(--y);color:var(--ink);font-weight:700;font-size:16px;line-height:1;text-decoration:none;white-space:nowrap;transition:transform .15s ease-out}
.btn:active{transform:scale(.97)}
.again{margin-top:14px;color:var(--dim);font-size:14px;text-decoration:none;border-bottom:1px solid #3a3833}
.again:hover{color:var(--fg)}
</style>
</head>
<body>
<main>
  <img src="img/logo.svg" alt="">
  <h1>Открываем трек</h1>
  <p>Пробуем открыть в Яндекс Музыке. Если приложение не запустилось — слушай в браузере.</p>
  <a class="btn" id="open" href="https://music.yandex.ru/">Открыть в браузере</a>
  <a class="again" id="again" href="#" hidden>Попробовать приложение ещё раз</a>
</main>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  var track = (p.get('track') || '').replace(/[^0-9]/g, '');
  var album = (p.get('album') || '').replace(/[^0-9]/g, '');
  var web = track
    ? (album ? 'https://music.yandex.ru/album/' + album + '/track/' + track : 'https://music.yandex.ru/track/' + track)
    : 'https://music.yandex.ru/';
  var app = 'yandexmusic://track/' + track;
  var open = document.getElementById('open');
  var again = document.getElementById('again');
  open.href = web;
  if (!track) { location.replace(web); return; }
  again.hidden = false;
  again.addEventListener('click', function (e) { e.preventDefault(); location.href = app; });

  var gone = false;
  document.addEventListener('visibilitychange', function () { if (document.hidden) gone = true; });
  location.href = app;
  // Диалог браузера о запуске приложения оставляет вкладку видимой: если через
  // несколько секунд её так и не скрыли, значит приложения нет — уходим в веб.
  setTimeout(function () { if (!gone) location.replace(web); }, 3500);
})();
</script>
</body>
</html>
