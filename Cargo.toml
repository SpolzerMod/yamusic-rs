[package]
name = "yamusic-rs"
version = "1.0.2"
edition = "2021"
rust-version = "1.92"
license = "GPL-3.0-only"
description = "Яндекс Музыка RS — неофициальный клиент Яндекс Музыки на Rust"
repository = "https://github.com/SpolzerMod/yamusic-rs"

[dependencies]
skia-safe = { version = "0.153.3", default-features = false }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-skia", "unstable-fontique-011", "unstable-winit-030"] }
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-aac", "symphonia-isomp4"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
miniz_oxide = "0.8"

# Win32 нужен только сборке для Windows (окно, трей, DPAPI, автозапуск).
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_HiDpi",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Registry",
  "Win32_Security_Cryptography",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_Shell_Common",
  "Win32_System_Com",
]

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
