[package]
name = "yamusic-rs"
version = "1.0.0"
edition = "2021"
rust-version = "1.92"
license = "GPL-3.0-only"
description = "Яндекс Музыка RS — неофициальный клиент Яндекс Музыки на Rust"
repository = "https://github.com/SpolzerMod/yamusic-rs"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "unstable-fontique-011", "unstable-winit-030"] }
rodio = { version = "0.20", default-features = false, features = ["symphonia-mp3", "symphonia-aac", "symphonia-isomp4"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
miniz_oxide = "0.8"

[target.'cfg(windows)'.dependencies]
# Кэш глифов Skia (gui.rs::apply_mode).
skia-safe = { version = "0.153.3", default-features = false }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_HiDpi",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Registry",
  "Win32_Security_Cryptography",
  "Win32_UI_Controls_Dialogs",
]

[target.'cfg(not(target_os = "windows"))'.dependencies]
# MPRIS 2 (виджет медиа в GNOME Shell, системные медиа-клавиши). 0.10+ не собираются — пинну 0.9.
mpris-server = "=0.9.0"
# Диалог выбора файла (xdg-desktop-portal) — обложка плейлиста.
rfd = "0.15"
# Локальный рантайм для MPRIS-потока: rt — спавн задач, sync — канал снапшотов.
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.deb]
maintainer = "SpolzerMod <https://github.com/SpolzerMod/yamusic-rs>"
license-file = ["LICENSE", "2"]
depends = "libc6 (>= 2.38), libstdc++6, libasound2, libegl1, libgl1, libwayland-client0, libwayland-egl1, libxkbcommon0, libfontconfig1, libfreetype6, libgcc-s1, wl-clipboard, xdg-utils"
# xclip — запасной путь для буфера обмена под X11 (в Wayland-сессии хватает wl-clipboard);
# xdg-user-dirs — чтобы скачивание шло в настоящий каталог музыки (иначе ~/Music).
recommends = "xclip, xdg-user-dirs"
section = "sound"
priority = "optional"
extended-description = """\
Неофициальный клиент Яндекс Музыки на Rust. Нативное окно (Slint + femtovg), \
MPRIS-управление и системные медиа-клавиши, автозапуск, эквалайзер, тексты песен."""
assets = [
  ["target/release/yamusic-rs", "usr/bin/", "755"],
  ["packaging/yamusic-rs.desktop", "usr/share/applications/", "644"],
  ["packaging/icons/16.png", "usr/share/icons/hicolor/16x16/apps/yamusic-rs.png", "644"],
  ["packaging/icons/32.png", "usr/share/icons/hicolor/32x32/apps/yamusic-rs.png", "644"],
  ["packaging/icons/48.png", "usr/share/icons/hicolor/48x48/apps/yamusic-rs.png", "644"],
  ["packaging/icons/64.png", "usr/share/icons/hicolor/64x64/apps/yamusic-rs.png", "644"],
  ["packaging/icons/128.png", "usr/share/icons/hicolor/128x128/apps/yamusic-rs.png", "644"],
  ["packaging/icons/256.png", "usr/share/icons/hicolor/256x256/apps/yamusic-rs.png", "644"],
]
